name: bench

# 10 section 9: the p99 gates. Manual only: the local run on MARS in docker is the real gate
# (AIBUS_RUNNER_CLASS=mars, baselines in benches/baselines/mars/). This workflow is the same
# thing on a hosted runner, for when someone wants it. A p99 over its budget, or more than 20 %
# over the committed baseline for the runner class (see benches/gate.rs), fails. A class with no
# baseline yet only enforces the budgets; `AIBUS_BENCH_SAVE=1` writes one.

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never
  AIBUS_BENCH_GATE: "1"
  AIBUS_RUNNER_CLASS: github-ubuntu-latest

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@ccc8c1f930153b792217f06c65a38f23a882993a # 1.85
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: commit_stream on mini
        run: cargo bench --locked -p aibus-core --bench commit_stream
      - name: hydrate_snapshot
        run: cargo bench --locked -p aibus-core --bench hydrate_snapshot
      - name: render_dashboard
        run: cargo bench --locked -p aibus-tui --bench render_dashboard
      - name: soft gates, logged
        run: cargo test --locked --release -p aibus-testkit --test startup_time --test streaming_cpu -- --nocapture
