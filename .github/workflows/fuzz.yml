name: fuzz

# 10 section 1: the four fuzz targets (agent_def, handoff, redactor, tool_pattern) every night.
# GitHub Actions are switched off for this repo, so the same run is `sh tools/fuzz.sh 120` inside
# a rust container (see docs/SECURITY.md). A crash is saved under fixtures/fuzz/<target>/ with a
# unit test, and fuzz/corpus is replayed on every push by crates/aibus-core/tests/security/fuzz.rs.

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@ccc8c1f930153b792217f06c65a38f23a882993a # 1.85
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: fuzz
      - name: fuzz every target
        run: sh tools/fuzz.sh 120
      - name: keep what a crash left behind
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts
