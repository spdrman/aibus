[workspace]
resolver = "2"
members = ["crates/*"]
# Own lockfile and the private causl source: see crates/aibus-graph-causl/Cargo.toml. `fuzz` is
# cargo-fuzz (nightly) with its own lockfile.
exclude = ["crates/aibus-graph-causl", "fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/spdrman/aibus"
publish = false

[workspace.dependencies]
aibus-core = { path = "crates/aibus-core" }
aibus-graph = { path = "crates/aibus-graph" }
aibus-mcp = { path = "crates/aibus-mcp" }
aibus-provider = { path = "crates/aibus-provider" }
aibus-provider-anthropic = { path = "crates/aibus-provider-anthropic" }
aibus-provider-http = { path = "crates/aibus-provider-http" }
aibus-provider-openai = { path = "crates/aibus-provider-openai" }
aibus-tui = { path = "crates/aibus-tui" }
aibus-testkit = { path = "crates/aibus-testkit" }
