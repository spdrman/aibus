[package]
name = "aibus-extension"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# The extension SDK of EPIC A (#286): the manifest contract and its schema, version and capability
# negotiation, the hostile-input package reader, the local registry and the installed store, and
# the sandbox that turns a verified manifest into the one launch the host is willing to make. An
# extension is data (a manifest, fixtures and, for the declarative engine, a few mapping rules):
# no code from a package ever runs inside aibus, and only the host starts a process, and only a program on the host's
# allowlist of official CLIs, with a bounded environment and the host's limits.
[features]
# The WASM guest host (#333). Off by default: wasmtime and its compiler are most of this crate's
# build time and binary size, and the owner has not yet decided whether a release build carries
# them. With the feature off, a manifest that names a module is refused at parse time.
wasm = ["dep:wasmtime"]

[dependencies]
aibus-core.workspace = true
aibus-supervisor = { path = "../aibus-supervisor" }
aibus-trace = { path = "../aibus-trace" }
regex = "1"
# Pinned to the 36.0.x long-term-support line: it still gets security fixes and its MSRV (1.86) fits
# the workspace's 1.89, while 40.0.4 (the newest 1.89 release) has open advisories. No default features:
# no WASI, no component model, no async, no cache, no profiling. The guest gets no ambient authority.
wasmtime = { version = "=36.0.20", optional = true, default-features = false, features = ["runtime", "cranelift", "std"] }
ring = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
toml = "0.8"
uuid = { version = "1", features = ["v7"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", default-features = false, features = ["std", "fs", "process"] }

[dev-dependencies]
tempfile = "3"
# Hostile guests in the tests are written as WAT.
wat = "1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "process", "io-util", "time", "sync"] }
tokio-util = "0.7"
