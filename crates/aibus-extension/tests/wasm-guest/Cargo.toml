# The guest the WASM conformance tests run (#333): the template's declarative rules, written as a
# stateful parser. Not a member of the aibus workspace; built by build.sh and checked in as
# parser.wasm so the tests need no wasm target. It targets wasm32-unknown-unknown, never WASI.
[package]
name = "aibus-wasm-guest"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
serde_json = "1"

[workspace]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
