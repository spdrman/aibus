[package]
name = "aibus-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
aibus-core.workspace = true
# D-13: the three features and nothing else. `client`, `auth*`, `reqwest` and the HTTP transports
# would bring a second `reqwest`, which `deny.toml` bans.
rmcp = { version = "3.9", default-features = false, features = ["server", "macros", "transport-io"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "time", "io-std"] }
tracing = "0.1"
ulid = "1"

[dev-dependencies]
aibus-testkit.workspace = true
