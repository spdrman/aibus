[package]
name = "aibus-testkit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
aibus-core.workspace = true
aibus-graph.workspace = true
aibus-provider.workspace = true
aibus-tui.workspace = true
base64 = "0.22"
ratatui = "0.30"
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["time", "test-util", "rt"] }
ulid = "1"
zstd = "0.13"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }

[dev-dependencies]
aibus-provider-anthropic.workspace = true
aibus-provider-openai.workspace = true
async-trait = "0.1"
wiremock = "0.6"
tokio = { version = "1", features = ["macros", "rt", "sync", "time", "test-util"] }
tokio-util = "0.7"
