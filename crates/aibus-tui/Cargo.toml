[package]
name = "aibus-tui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# The centre column drawn through rataflow (docs/spikes/D1.1-rataflow.md). On by default since
# 0.2.0; `--no-default-features` is the way back to the hand-drawn connectors for a build from
# source. `sugiyama` stays out: positions come from our row budget.
default = ["flow-diagram"]
flow-diagram = ["dep:rataflow"]

[dependencies]
aibus-core.workspace = true
aibus-graph.workspace = true
aibus-provider.workspace = true
arboard = { version = "3", default-features = false }
crossterm = "0.29"
ratatui = "0.30"
rataflow = { version = "0.1", optional = true, default-features = false, features = ["crossterm"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time", "rt", "macros"] }
toml = "0.8"

[dev-dependencies]
aibus-testkit.workspace = true
tempfile = "3"
ulid = "1"
tokio = { version = "1", features = ["sync", "time", "rt", "macros", "test-util"] }

[[bench]]
name = "render_dashboard"
harness = false
