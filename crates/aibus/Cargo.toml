[package]
name = "aibus"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
aibus-core.workspace = true
aibus-graph.workspace = true
aibus-provider.workspace = true
aibus-provider-anthropic.workspace = true
aibus-provider-openai.workspace = true
aibus-tui.workspace = true
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust", "vendored"] }
notify = "8"
rpassword = "7"
serde_json = "1"
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }
tokio-util = "0.7"
toml = "0.8"
toml_edit = "0.22"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }
zeroize = "1"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", default-features = false, features = ["std", "termios"] }
signal-hook = "0.3"

[dev-dependencies]
tempfile = "3"
zstd = "0.13"
regex = "1"
ulid = "1"
