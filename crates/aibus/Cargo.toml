[package]
name = "aibus"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# Forwarded to the TUI. On by default since 0.2.0, so release.yml (which builds defaults) ships the
# rataflow path; `--no-default-features` builds the hand-drawn one.
default = ["flow-diagram"]
flow-diagram = ["aibus-tui/flow-diagram"]

[dependencies]
aibus-core.workspace = true
aibus-graph.workspace = true
aibus-mcp.workspace = true
aibus-provider.workspace = true
aibus-provider-anthropic.workspace = true
aibus-provider-gemini.workspace = true
aibus-provider-http.workspace = true
aibus-provider-openai.workspace = true
aibus-tui.workspace = true
async-trait = "0.1"
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust", "vendored"] }
notify = "8"
rand = "0.9"
# `aibus mcp --http` (E11): the listener lives here and nowhere else; `aibus-mcp` stays
# transport-free. `server` + the Streamable HTTP service, no client and no reqwest.
rmcp = { version = "3.9", default-features = false, features = ["server", "transport-streamable-http-server"] }
http = "1"
http-body-util = "0.1"
bytes = "1"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
subtle = "2"
rpassword = "7"
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt", "sync", "time", "macros", "net", "io-util"] }
tokio-util = "0.7"
toml = "0.8"
toml_edit = "0.22"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }
zeroize = "1"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", default-features = false, features = ["std", "termios"] }
signal-hook = "0.3"

[dev-dependencies]
tempfile = "3"
aibus-testkit.workspace = true
zstd = "0.13"
tokio = { version = "1", features = ["rt", "sync", "time", "macros", "net", "io-util", "test-util"] }
regex = "1"
ulid = "1"
