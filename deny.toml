[graph]
all-features = true

[advisories]
version = 2
# cargo-deny 0.20 dropped the `vulnerability` key: vulnerabilities are always denied.
# `unmaintained` is now a scope ("all" checks every crate), not a level, so the spec's
# `unmaintained = "warn"` cannot be written literally; a hit fails the check until reviewed.
unmaintained = "all"
yanked = "deny"
# chrono 0.4.45 is flagged unmaintained (no fixed version exists, and it is a notice, not a
# vulnerability). It comes in through rmcp 3.9 and schemars, so only `aibus-mcp` links it. Reviewed
# for the v1 gate (#295) on 2026-11-25; review again by 2027-02-25, or when rmcp moves off it, and
# drop this entry then. `unmaintained = "all"` stays, so any other notice still fails the check.
ignore = [
    { id = "RUSTSEC-2026-0543", reason = "chrono unmaintained notice, via rmcp and schemars, no fix available; review by 2027-02-25 (#295)" },
]

[licenses]
version = 2
# `Apache-2.0 WITH LLVM-exception` is wasmtime's and cranelift's licence (#333): Apache-2.0 plus a
# grant that lifts the attribution duty for compiled output, so it is no stricter than Apache-2.0
# and compatible with this repo's MIT licence.
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "MPL-2.0", "Unicode-3.0", "Unicode-DFS-2016", "Zlib"]
# `notify` (the agent directory watcher) is published under CC0-1.0, a public domain dedication.
# Allowed for that crate only.
# `arboard` (the system clipboard behind OSC 52, 05 section 6.1) brings `clipboard-win` and
# `error-code` on Windows, both under BSL-1.0 (the Boost licence, permissive). Allowed for those two.
exceptions = [
    { crate = "notify", allow = ["CC0-1.0"] },
    { crate = "clipboard-win", allow = ["BSL-1.0"] },
    { crate = "error-code", allow = ["BSL-1.0"] },
]

[bans]
multiple-versions = "warn"
wildcards = "allow"

[[bans.deny]]
crate = "tokio"
deny-multiple-versions = true

[[bans.deny]]
crate = "reqwest"
deny-multiple-versions = true

[[bans.deny]]
crate = "serde"
deny-multiple-versions = true

[[bans.deny]]
crate = "ratatui"
deny-multiple-versions = true

# ratatui 0.30 re-exports crossterm 0.29 through `ratatui-crossterm`; a second crossterm means
# mismatched event types, so the pair is held together.
[[bans.deny]]
crate = "crossterm"
deny-multiple-versions = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
