[graph]
all-features = true

[advisories]
version = 2
# cargo-deny 0.20 dropped the `vulnerability` key: vulnerabilities are always denied.
# `unmaintained` is now a scope ("all" checks every crate), not a level, so the spec's
# `unmaintained = "warn"` cannot be written literally; a hit fails the check until reviewed.
unmaintained = "all"
yanked = "deny"
# ratatui 0.29 needs `paste`, a compile-time proc macro with no runtime code. ratatui 0.30 drops it
# but needs rustc 1.88, and the MSRV is pinned at 1.85. Revisit when the MSRV moves.
ignore = [
    { id = "RUSTSEC-2024-0436", reason = "paste is unmaintained but only expands macros at build time; ratatui 0.29 requires it" },
]

[licenses]
version = 2
allow = ["MIT", "Apache-2.0", "BSD-2-Clause", "BSD-3-Clause", "ISC", "MPL-2.0", "Unicode-3.0", "Unicode-DFS-2016", "Zlib"]
# `notify` (the agent directory watcher) is published under CC0-1.0, a public domain dedication.
# Allowed for that crate only.
# `arboard` (the system clipboard behind OSC 52, 05 section 6.1) brings `clipboard-win` and
# `error-code` on Windows, both under BSL-1.0 (the Boost licence, permissive). Allowed for those two.
exceptions = [
    { crate = "notify", allow = ["CC0-1.0"] },
    { crate = "clipboard-win", allow = ["BSL-1.0"] },
    { crate = "error-code", allow = ["BSL-1.0"] },
]

[bans]
multiple-versions = "warn"
wildcards = "allow"

[[bans.deny]]
crate = "tokio"
deny-multiple-versions = true

[[bans.deny]]
crate = "reqwest"
deny-multiple-versions = true

[[bans.deny]]
crate = "serde"
deny-multiple-versions = true

[[bans.deny]]
crate = "ratatui"
deny-multiple-versions = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
