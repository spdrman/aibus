# expect: step 2: two steps run agent explore as native subagents; give them ids, which become their names
[[step]]
id = "lead"
agent = "general"
runtime = "cli.claude"
prompt = "p {{input}}"

[[step]]
agent = "explore"
runtime = "cli.claude"
parent = "lead"
mode = "native"
prompt = "q"

[[step]]
agent = "explore"
runtime = "cli.claude"
parent = "lead"
mode = "native"
prompt = "r"
